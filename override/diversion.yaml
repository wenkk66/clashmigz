# ============================================================================
# Clash Mi 全局分流覆写模板 (YAML Overwrite)
# 仓库: your-github-username/clash-mi-override (main)
# 特性: 自动测速优选(url-test) / 故障转移(fallback) / 负载均衡 / 去广告(HTTPDNS+AdGuard)
# 用法: 导入 Clash Mi「覆写」页或通过 Raw URL 添加，自动作用于客户端内所有订阅
# ============================================================================
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
dns!:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - RULE-SET:private
    - RULE-SET:cn-domain
    - RULE-SET:category-httpdns-cn
    - RULE-SET:awavenue-ads
    - RULE-SET:category-ads-all
    - RULE-SET:adblock-ultra
    - RULE-SET:cats-adrules
    - RULE-SET:adguard-base
    - RULE-SET:privacy-domain
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
    - tls://8.8.8.8:853
  nameserver-policy:
    RULE-SET:category-httpdns-cn,awavenue-ads,category-ads-all,adblock-ultra,cats-adrules,adguard-base,privacy-domain:
      - rcode://success
    geosite:category-ads-all:
      - rcode://success
    geosite:cn,private:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    geosite:geolocation-!cn:
      - https://dns.google/dns-query
      - https://1.1.1.1/dns-query
      - tls://8.8.8.8:853
    RULE-SET:private,cn-domain,apple-cn,microsoft-cn:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
proxy-groups!:
  - name: ♻️ 自动测速优选
    type: url-test
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|距离下次重置|Traffic|Expire|\d+(?:\.\d+)?\s?(?:GB|TB|MB)\b|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动测速优选
      - 🚨 故障转移
      - ⚖️ 负载均衡
