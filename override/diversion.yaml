# ============================================================================
# Clash Mi 全局分流覆写模板 (YAML Overwrite)
# 仓库: your-github-username/clash-mi-override (main)
# 特性: 自动测速优选(url-test) / 故障转移(fallback) / 负载均衡 / 去广告(HTTPDNS+AdGuard)
# 用法: 导入 Clash Mi「覆写」页或通过 Raw URL 添加，自动作用于客户端内所有订阅
# ============================================================================
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
dns!:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - RULE-SET:private
    - RULE-SET:cn-domain
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
  nameserver-policy:
    RULE-SET:private,cn-domain,apple-cn,microsoft-cn:
      - https://dns.alidns.com/dns-query
    geosite:cn,private:
      - https://dns.alidns.com/dns-query
    geosite:geolocation-!cn:
      - https://1.1.1.1/dns-query
proxy-groups!:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动测速优选
      - 🚨 故障转移
      - ⚖️ 负载均衡
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🇪🇺 欧洲节点
      - DIRECT
  - name: ♻️ 自动测速优选
    type: url-test
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🚨 故障转移
    type: fallback
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 180
  - name: ⚖️ 负载均衡
    type: load-balance
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
  - name: 🛡️ 广告拦截
    type: select
    proxies:
      - REJECT
      - REJECT-DROP
      - DIRECT
  - name: 🤖 AI 服务专属
    type: select
    proxies:
      - 🇸🇬 狮城节点
      - 🇺🇸 美国节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
    filter: 美|新|日|台|US|SG|JP|TW|🇺🇸|🇸🇬|🇯🇵|🇹🇼
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国|港|HK|Hong|🇭🇰|俄|RU|CN
  - name: 🎵 TikTok 专属
    type: select
    proxies:
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇹🇼 台湾节点
      - 🚀 节点选择
  - name: 🎬 流媒体解锁
    type: select
    proxies:
      - 🚀 节点选择
      - 🚨 故障转移
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
  - name: 📲 电报与社交
    type: select
    proxies:
      - 🚀 节点选择
      - 🚨 故障转移
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
  - name: 🎮 游戏与平台
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: 港|HK|Hong\s?Kong|🇭🇰
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇹🇼 台湾节点
    type: url-test
    include-all: true
    filter: 台|TW|TaiWan|新北|彰化|🇹🇼
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: 日|JP|Japan|东京|大阪|🇯🇵
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇸🇬 狮城节点
    type: url-test
    include-all: true
    filter: 新|SG|Singapore|狮城|🇸🇬
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇺🇸 美国节点
    type: url-test
    include-all: true
    filter: 美|US|United\s?States|洛杉矶|硅谷|圣何塞|🇺🇸
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: 韩|KR|Korea|首尔|春川|🇰🇷
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇪🇺 欧洲节点
    type: url-test
    include-all: true
    filter: 英|德|法|荷|瑞|意|UK|DE|FR|NL|CH|GB|伦敦|法兰克福|阿姆斯特丹|🇬🇧|🇩🇪|🇫🇷
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|重置|Traffic|Expire|GB|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动测速优选
      - 🚨 故障转移
      - DIRECT
