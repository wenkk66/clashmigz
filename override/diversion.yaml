      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🇪🇺 欧洲节点
      - DIRECT
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|距离下次重置|Traffic|Expire|\d+(?:\.\d+)?\s?(?:GB|TB|MB)\b|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
  - name: 🚨 故障转移
    type: fallback
    include-all: true
    exclude-filter: 剩余流量|套餐到期|过期时间|官网|距离下次重置|Traffic|Expire|\d+(?:\.\d+)?\s?(?:GB|TB|MB)\b|Test|测试|通知|订阅|群组|邀请|倍率.*[3-9]|10x|回国
