  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,geolocation-non-cn,🚀 节点选择
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼
